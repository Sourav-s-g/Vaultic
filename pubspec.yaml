name: cents
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  supabase_flutter: ^2.9.0
  pin_code_fields: ^8.0.1
  webview_flutter: ^4.13.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  uuid: ^4.5.1
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  permission_handler: ^11.3.1
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  package_info_plus: ^4.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
     - assets/img.png
     - assets/img_1.png
     - assets/Vaultabove.jpeg
     - assets/OTP_verification_image.jpeg
     - assets/Vautlic_appicon.jpeg
     - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Vautlic_appicon.jpeg
  adaptive_icon_background: "#032221"
  adaptive_icon_foreground: assets/Vautlic_appicon.jpeg
